{% extends 'base.html' %}

{% block title %}修改密碼 - EAGLE 2.0 LMS{% endblock %}

{% block content %}
<style>
    .pw-card {
        max-width: 480px; margin: 3rem auto;
        background: #fff; border-radius: 8px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.09); overflow: hidden;
    }
    .pw-card-hd {
        background: linear-gradient(135deg, #1a5276 0%, #2980b9 100%);
        color: #fff; padding: 1.5rem 2rem;
    }
    .pw-card-hd h1 { font-size: 1.3rem; margin: 0; }
    .pw-card-bd { padding: 2rem; }
    .form-group { margin-bottom: 1.3rem; }
    .form-group label {
        display: block; font-size: 0.88rem;
        color: #1a5276; font-weight: 600; margin-bottom: 0.4rem;
    }
    .form-group input {
        width: 100%; padding: 0.7rem 0.9rem;
        border: 1px solid #ddd; border-radius: 4px;
        font-size: 0.95rem; font-family: inherit;
    }
    .form-group input:focus {
        outline: none; border-color: #2980b9;
        box-shadow: 0 0 0 3px rgba(41,128,185,0.1);
    }
    .btn-row { display: flex; gap: 0.8rem; margin-top: 1.5rem; }
    .hint { font-size: 0.82rem; color: #aaa; margin-top: 0.3rem; }
</style>

<div class="pw-card">
    <div class="pw-card-hd">
        <h1>🔑 修改密碼</h1>
    </div>
    <div class="pw-card-bd">
        <form method="POST">
            <div class="form-group">
                <label>目前密碼</label>
                <input type="password" name="current_password" required autofocus>
            </div>
            <div class="form-group">
                <label>新密碼</label>
                <input type="password" name="new_password" required minlength="6">
                <div class="hint">至少 6 個字元</div>
            </div>
            <div class="form-group">
                <label>確認新密碼</label>
                <input type="password" name="confirm_password" required>
            </div>
            <div class="btn-row">
                <button type="submit" class="btn btn-primary">儲存新密碼</button>
                <a href="{{ url_for('dashboard') }}" class="btn btn-outline">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
